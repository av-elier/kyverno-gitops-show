apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ticket-for-prod
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: has-prod-changes
      expression: "has(object.summary) && object.summary.hasProdChanges == true"
  validations:
    - message: "Production GitOps changes require a valid changeTicket (CHG-#### or JIRA-####)."
      expression: >-
        has(object.metadata) &&
        has(object.metadata.changeTicket) &&
        object.metadata.changeTicket.matches('^(CHG|JIRA)-[0-9]+$')
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forbid-zero-replicas-in-prod
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: has-prod-changes
      expression: "has(object.summary) && object.summary.hasProdChanges == true"
  validations:
    - message: "Scaling replicas to 0 in production manifests is forbidden."
      expression: >-
        has(object.files) &&
        object.files.all(f, !(f.environment == 'prod' && f.addedText.matches('(?m)^[[:space:]]*replicas:[[:space:]]*0([[:space:]]|$)')))
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forbid-tls-disable-in-prod
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: has-prod-changes
      expression: "has(object.summary) && object.summary.hasProdChanges == true"
  validations:
    - message: "Disabling TLS (tlsEnabled: false) in production is forbidden."
      expression: >-
        has(object.files) &&
        object.files.all(f, !(f.environment == 'prod' && f.addedText.matches('(?i)tlsEnabled:[[:space:]]*false')))
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forbid-hardcoded-secrets
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: has-added-lines
      expression: "has(object.summary) && object.summary.totalAdded > 0"
  validations:
    - message: "Added diff lines must not contain hardcoded secrets, tokens, or passwords."
      expression: >-
        has(object.files) &&
        object.files.all(f, f.addedLines.all(line,
          !line.matches('(?i)(ghp_[A-Za-z0-9]{8,}|AKIA[0-9A-Z]{8,}|(password|secret|api_key|token)[[:space:]]*[:=][[:space:]]*["\x27]?[A-Za-z0-9_\\-]{6,})')
        ))
