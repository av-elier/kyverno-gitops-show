apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: >-
      Forbids mutable :latest or untagged container images in Deployments.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - message: "Container images must use an explicit, immutable tag (':latest' or untagged images are forbidden)."
      expression: "object.spec.template.spec.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root and Disallow Privilege Escalation
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: >-
      Requires Deployments to set pod securityContext.runAsNonRoot=true and
      disallow privilege escalation on every container.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - message: "Deployments must set pod securityContext.runAsNonRoot=true and disallow privilege escalation."
      expression: >-
        object.spec.template.spec.?securityContext.?runAsNonRoot.orValue(false) == true &&
        object.spec.template.spec.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
