apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-standard-labels
  annotations:
    policies.kyverno.io/title: Require Team and Environment Labels
    policies.kyverno.io/category: Governance
    policies.kyverno.io/description: >-
      Audits Deployments that are missing standard ownership labels ('team' and 'env').
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - message: "Deployments should define metadata.labels.team and metadata.labels.env for ownership tracking."
      expression: "object.metadata.?labels.?team.orValue('') != '' && object.metadata.?labels.?env.orValue('') != ''"
