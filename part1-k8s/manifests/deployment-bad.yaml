apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: production
  labels:
    app: payments-api
    # Missing 'team' and 'env' labels -> triggers Audit policy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      # Missing securityContext.runAsNonRoot: true -> triggers Enforce policy
      containers:
        - name: web
          image: nginx:latest # ':latest' tag -> triggers Enforce policy
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: true # Allowed escalation -> triggers Enforce policy
