apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aws-secret-no-plaintext-value
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-aws-secret-non-delete
      expression: "object.kind == 'AwsSecretsManagerSecret' && object.operation != 'delete'"
  validations:
    - message: "AwsSecretsManagerSecret must never store plaintext secretString or secretBinary in GitOps JSON."
      expression: >-
        has(object.after) &&
        has(object.after.spec) &&
        (!has(object.after.spec.secretString) || object.after.spec.secretString == null) &&
        (!has(object.after.spec.secretBinary) || object.after.spec.secretBinary == null)
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aws-secret-prod-rotation-and-kms
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-prod-aws-secret-non-delete
      expression: "object.kind == 'AwsSecretsManagerSecret' && object.environment == 'prod' && object.operation != 'delete'"
  validations:
    - message: "Production AWS secret must keep rotationEnabled=true, rotationDays within 1..90, and a customer-managed KMS ARN."
      expression: >-
        has(object.after) &&
        has(object.after.spec) &&
        has(object.after.spec.rotationEnabled) &&
        object.after.spec.rotationEnabled == true &&
        has(object.after.spec.rotationDays) &&
        object.after.spec.rotationDays != null &&
        object.after.spec.rotationDays > 0 &&
        object.after.spec.rotationDays <= 90 &&
        has(object.after.spec.kmsKeyId) &&
        object.after.spec.kmsKeyId != null &&
        object.after.spec.kmsKeyId.startsWith('arn:aws:kms:')
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aws-secret-update-allowed-attributes
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-aws-secret-update
      expression: "object.operation == 'update' && object.kind == 'AwsSecretsManagerSecret'"
  validations:
    - message: "AwsSecretsManagerSecret update may only modify rotationDays, description, or metadata.labels/* (kmsKeyId, secretName, and rotationEnabled cannot be changed)."
      expression: >-
        !has(object.diff) ||
        !has(object.diff.changes) ||
        object.diff.changes == null ||
        object.diff.changes.all(c,
          c.path in ['/spec/rotationDays', '/spec/description'] ||
          c.path.startsWith('/metadata/labels/')
        )
