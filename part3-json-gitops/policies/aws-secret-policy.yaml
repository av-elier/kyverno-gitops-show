apiVersion: json.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: aws-secret-gitops-guardrails
spec:
  rules:
    - name: aws-secret-no-plaintext-value
      identifier: "after.metadata.name"
      match:
        all:
          - kind: "AwsSecretsManagerSecret"
            (operation != 'delete'): true
      assert:
        all:
          - message: "AwsSecretsManagerSecret must never store plaintext secretString or secretBinary in GitOps JSON."
            check:
              (after.spec.secretString == `null` && after.spec.secretBinary == `null`): true

    - name: aws-secret-prod-rotation-and-kms
      identifier: "after.metadata.name"
      match:
        all:
          - kind: "AwsSecretsManagerSecret"
            environment: "prod"
            (operation != 'delete'): true
      assert:
        all:
          - message: "Production AWS secret must keep rotationEnabled=true, rotationDays within 1..90, and a customer-managed KMS ARN."
            check:
              after:
                spec:
                  rotationEnabled: true
                  (rotationDays != `null` && rotationDays > `0` && rotationDays <= `90`): true
                  (kmsKeyId != `null` && starts_with(kmsKeyId, 'arn:aws:kms:')): true

    - name: aws-secret-update-allowed-attributes
      identifier: "after.metadata.name"
      match:
        all:
          - operation: "update"
            kind: "AwsSecretsManagerSecret"
      assert:
        all:
          - message: "AwsSecretsManagerSecret update may only modify rotationDays, description, or metadata.labels/* (kmsKeyId, secretName, and rotationEnabled cannot be changed)."
            check:
              diff:
                ~.changes:
                  (contains(['/spec/rotationDays', '/spec/description'], path) || starts_with(path, '/metadata/labels/')): true
