apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kafka-update-allowed-attributes
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-kafka-update
      expression: "object.operation == 'update' && object.kind == 'KafkaTopic'"
  validations:
    - message: "KafkaTopic update may only modify partitions, retentionMs, maxMessageBytes, acls/*, or metadata.labels/* (cleanupPolicy and replicationFactor are immutable)."
      expression: >-
        !has(object.diff) ||
        !has(object.diff.changes) ||
        object.diff.changes == null ||
        object.diff.changes.all(c,
          c.path in ['/spec/partitions', '/spec/retentionMs', '/spec/maxMessageBytes', '/spec/acls'] ||
          c.path.startsWith('/spec/acls/') ||
          c.path.startsWith('/metadata/labels/')
        )
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kafka-no-partition-shrink
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-kafka-update
      expression: "object.operation == 'update' && object.kind == 'KafkaTopic'"
  validations:
    - message: "KafkaTopic partitions cannot be reduced or removed (after.spec.partitions >= before.spec.partitions)."
      expression: >-
        has(object.after) &&
        has(object.after.spec) &&
        has(object.after.spec.partitions) &&
        object.after.spec.partitions != null &&
        has(object.before) &&
        has(object.before.spec) &&
        has(object.before.spec.partitions) &&
        object.before.spec.partitions != null &&
        object.after.spec.partitions >= object.before.spec.partitions
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kafka-prod-replication-floor
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-prod-kafka-non-delete
      expression: "object.kind == 'KafkaTopic' && object.environment == 'prod' && object.operation != 'delete'"
  validations:
    - message: "Production KafkaTopic must have replicationFactor >= 3."
      expression: >-
        has(object.after) &&
        has(object.after.spec) &&
        has(object.after.spec.replicationFactor) &&
        object.after.spec.replicationFactor != null &&
        object.after.spec.replicationFactor >= 3
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kafka-prod-acl-guardrails
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-prod-kafka-with-acls
      expression: >-
        object.kind == 'KafkaTopic' &&
        object.environment == 'prod' &&
        object.operation != 'delete' &&
        has(object.after) &&
        has(object.after.spec) &&
        has(object.after.spec.acls) &&
        object.after.spec.acls != null
  validations:
    - message: "Production KafkaTopic ACL entries must not use wildcard principal ('User:*') and may only grant READ, WRITE, or DESCRIBE."
      expression: >-
        object.after.spec.acls.all(a,
          has(a.principal) &&
          a.principal != null &&
          a.principal != 'User:*' &&
          has(a.operation) &&
          a.operation in ['READ', 'WRITE', 'DESCRIBE']
        )
