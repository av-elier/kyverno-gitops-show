apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: production
  labels:
    app: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      initContainers:
        - name: migrator
          image: localhost:5000/migrator
      containers:
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: true
