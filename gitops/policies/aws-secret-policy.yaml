apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aws-secret-no-plaintext-value
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-aws-secret-non-delete
      expression: "object.kind == 'AwsSecretsManagerSecret' && object.operation != 'delete'"
  variables:
    - name: s
      expression: "object.?after.?spec.orValue({})"
  validations:
    - expression: "variables.s.?secretString.orValue(null) == null && variables.s.?secretBinary.orValue(null) == null"
      message: "AwsSecretsManagerSecret must never store plaintext secretString or secretBinary in GitOps config."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aws-secret-prod-rotation-and-kms
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-prod-aws-secret-non-delete
      expression: "object.kind == 'AwsSecretsManagerSecret' && object.environment == 'prod' && object.operation != 'delete'"
  variables:
    - name: s
      expression: "object.?after.?spec.orValue({})"
    - name: days
      expression: "variables.s.?rotationDays.orValue(null)"
    - name: kms
      expression: "variables.s.?kmsKeyId.orValue('')"
  validations:
    - expression: >-
        variables.s.?rotationEnabled.orValue(false) == true &&
        variables.days != null && variables.days > 0 && variables.days <= 90 &&
        variables.kms != null && variables.kms.startsWith('arn:aws:kms:')
      messageExpression: >-
        'Production AWS secret requires rotationEnabled=true, rotationDays in 1..90 (got ' +
        (variables.days != null ? string(variables.days) : 'missing') +
        '), and arn:aws:kms:* key (got ' + (variables.kms != null ? string(variables.kms) : 'missing') + ')'
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aws-secret-update-allowed-attributes
spec:
  validationActions:
    - Deny
  evaluation:
    mode: JSON
  matchConditions:
    - name: is-aws-secret-update
      expression: "object.operation == 'update' && object.kind == 'AwsSecretsManagerSecret'"
  variables:
    - name: changes
      expression: "object.?diff.?changes.orValue([])"
    - name: forbidden
      expression: >-
        variables.changes != null
          ? variables.changes.filter(c,
              !(c.path in ['/spec/rotationDays', '/spec/description'] ||
                c.path.startsWith('/metadata/labels/'))
            ).map(c, c.path)
          : []
  validations:
    - expression: "size(variables.forbidden) == 0"
      messageExpression: "'AwsSecretsManagerSecret update modified immutable attribute(s): ' + variables.forbidden.join(', ')"
